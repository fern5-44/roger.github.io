<!doctype html>
<!-- NICHT auf GitHub Pages hochladen. Diese Datei lokal per Doppelklick öffnen –
     dann steht dein Token nirgends öffentlich. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmeldungen exportieren</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Anmeldungen</h1>
      <p>Lokales Werkzeug. Lädt die Zeilen aus der Tabelle und speichert sie als Excel-Datei.</p>

      <p>
        <label for="endpoint">Web-App-URL (/exec)</label>
        <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/AKfycbwpiKI0KTew2TdgcO1_k4WA1-syOZBT309YuQTD4ibTVxJvJa4UPaV-6vRhhEE4tAdU/exec" />
      </p>
      <p>
        <label for="token">Token</label>
        <input id="token" type="text" placeholder="544061287" />
      </p>
      <p>
        <button type="button" id="load">Laden</button>
        <button type="button" id="export" disabled>Als .xlsx speichern</button>
      </p>
      <p id="status" role="status"></p>
      <div id="preview"></div>
    </main>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      let rows = []; // [[Kopfzeile], [Werte], ...]

      // Zugangsdaten bleiben in diesem Browser, nicht im Repository.
      ['endpoint', 'token'].forEach((k) => {
        $('#' + k).value = localStorage.getItem('admin_' + k) || '';
        $('#' + k).addEventListener('change', (e) => localStorage.setItem('admin_' + k, e.target.value));
      });

      /* Apps Script beantwortet keinen CORS-Preflight, und die /exec-URL leitet um.
         Mit JSONP umgeht man beides: das Skript ruft unsere Callback-Funktion auf. */
      function jsonp(url) {
        return new Promise((resolve, reject) => {
          const name = 'cb_' + Date.now();
          const script = document.createElement('script');
          const done = (fn) => {
            delete window[name];
            script.remove();
            fn();
          };
          window[name] = (data) => done(() => resolve(data));
          script.onerror = () => done(() => reject(new Error('Laden fehlgeschlagen')));
          script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + name;
          document.body.appendChild(script);
        });
      }

      $('#load').addEventListener('click', async () => {
        const url = $('#endpoint').value.trim();
        const token = $('#token').value.trim();
        if (!url) return ($('#status').textContent = 'Bitte die Web-App-URL eintragen.');
        $('#status').textContent = 'Lädt …';
        try {
          const res = await jsonp(url + '?action=export&token=' + encodeURIComponent(token));
          if (!res.ok) throw new Error(res.error === 'token' ? 'Token stimmt nicht.' : res.error);
          rows = res.rows || [];
          $('#status').textContent = `${Math.max(0, rows.length - 1)} Anmeldungen geladen.`;
          $('#export').disabled = rows.length < 2;
          render();
        } catch (err) {
          $('#status').textContent = 'Fehler: ' + err.message;
        }
      });

      $('#export').addEventListener('click', () => {
        const sheet = XLSX.utils.aoa_to_sheet(rows);
        sheet['!cols'] = (rows[0] || []).map(() => ({ wch: 22 })); // TODO: Breiten je Spalte
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, sheet, 'Anmeldungen');
        const stamp = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(book, `anmeldungen-${stamp}.xlsx`);
      });

      function render() {
        if (!rows.length) return ($('#preview').innerHTML = '');
        const cell = (v, tag) => `<${tag}>${String(v ?? '').replace(/[<>&]/g, '')}</${tag}>`;
        $('#preview').innerHTML =
          '<table><thead><tr>' +
          rows[0].map((h) => cell(h, 'th')).join('') +
          '</tr></thead><tbody>' +
          rows
            .slice(1)
            .map((r) => '<tr>' + r.map((v) => cell(v, 'td')).join('') + '</tr>')
            .join('') +
          '</tbody></table>';
      }
    </script>
  </body>
</html>
