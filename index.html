<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Anmeldung</title>

  <link rel="stylesheet" href="style.css" />
</head>


<body>

  <main>

    <!-- =====================================================
         KOPF
         ===================================================== -->

    <h1 id="title"></h1>

    <p id="meta"></p>

    <p
      id="progress"
      aria-live="polite">
    </p>

    <p
      id="status"
      role="status">
    </p>


    <!-- =====================================================
         FORMULAR
         ===================================================== -->

    <form
      id="rsvp"
      novalidate>


      <!-- ===================================================
           SCHRITT 0 – SICHERHEITSFRAGEN
           =================================================== -->

      <fieldset data-step="0">

        <legend>
          Ich bin kein Roboter.
        </legend>


        <p>
          Beantworte alle drei Fragen richtig,
          um weiterzukommen.
        </p>


        <!-- Frage 1 ----------------------------------------- -->

        <fieldset class="question">

          <legend>
            Frage 1: Wie alt werde ich?
          </legend>


          <label>
            <input
              type="radio"
              name="question1"
              value="10011"
            />
            10011
          </label>


          <label>
            <input
              type="radio"
              name="question1"
              value="1111"
            />
            1111
          </label>


          <label>
            <input
              type="radio"
              name="question1"
              value="11111"
            />
            11111
          </label>


          <label>
            <input
              type="radio"
              name="question1"
              value="10101"
            />
            10101
          </label>

        </fieldset>


        <!-- Frage 2 ----------------------------------------- -->

        <fieldset class="question">

          <legend>
            Frage 2: Welche Zutat kommt nicht auf eine Pizza?
          </legend>


          <label>
            <input
              type="radio"
              name="question2"
              value="salami"
            />
            Salami
          </label>


          <label>
            <input
              type="radio"
              name="question2"
              value="banane"
            />
            Banane
          </label>


          <label>
            <input
              type="radio"
              name="question2"
              value="ananas"
            />
            Ananas
          </label>


          <label>
            <input
              type="radio"
              name="question2"
              value="olive"
            />
            Olive
          </label>

        </fieldset>


        <!-- Frage 3 ----------------------------------------- -->

        <fieldset class="question">

          <legend>
            Frage 3: Was sind meine Lieblingsblumen?
          </legend>


          <label>
            <input
              type="radio"
              name="question3"
              value="rosen-tulpen"
            />
            Rosen &amp; Tulpen
          </label>


          <label>
            <input
              type="radio"
              name="question3"
              value="gaensebluemchen"
            />
            Gänseblümchen &amp; Vergissmeinnicht
          </label>


          <label>
            <input
              type="radio"
              name="question3"
              value="ranunkeln-chrysanthemen"
            />
            Ranunkeln &amp; Chrysanthemen
          </label>


          <label>
            <input
              type="radio"
              name="question3"
              value="sonnenblumen"
            />
            Sonnenblumen
          </label>

        </fieldset>


        <!-- Weiter ------------------------------------------ -->

        <p class="nav">

          <button
            type="button"
            data-next>
            Weiter
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           SCHRITT 1 – ANMELDUNG
           =================================================== -->

      <fieldset
        data-step="1"
        hidden>

        <legend>
          Bist du dabei?
        </legend>


        <p>

          <label for="vorname">
            Vorname
          </label>

          <input
            id="vorname"
            name="vorname"
            type="text"
            autocomplete="given-name"
            required
          />

        </p>


        <p>

          <label for="nachname">
            Nachname
          </label>

          <input
            id="nachname"
            name="nachname"
            type="text"
            autocomplete="family-name"
            required
          />

        </p>


        <p>

          <label for="lieblingslied">
            Dis Lieblingslied
          </label>

          <input
            id="lieblingslied"
            name="lieblingslied"
            type="text"
            autocomplete="off"
            placeholder="Titel – Interpret"
            required
          />

        </p>
        
        <p>

          <label for="zutat">
            Dini LIeblingszuetat uf dPizza
          </label>

          <input
            id="zutat"
            name="zutat"
            type="text"
            autocomplete="off"
            required
          />

        </p>


        <p class="nav">

          <button
            type="button"
            data-back>
            Zurück
          </button>


          <button
            type="button"
            data-next>
            Weiter
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           SCHRITT 2 – WIE LANGE BIST DU DABEI
           =================================================== -->

      <fieldset
        data-step="2"
        hidden>

        <legend id="choice-title"></legend>


        <div id="choices"></div>


        <p class="nav">

          <button
            type="button"
            data-back>
            Zurück
          </button>


          <button
            type="button"
            data-next>
            Weiter
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           SCHRITT 3 – BEMERKUNGEN
           =================================================== -->

      <fieldset
        data-step="3"
        hidden>

        <legend>
          Noch etwas?
        </legend>


        <p>

          <label for="remarks">

            Bemerkungen

            <span
              class="opt"
              id="remarks-hint">
              (optional)
            </span>

          </label>


          <textarea
            id="remarks"
            name="remarks"
            rows="5"
            maxlength="400"></textarea>

        </p>


        <p class="nav">

          <button
            type="button"
            data-back>
            Zurück
          </button>


          <button
            type="submit">
            Anmeldung abschicken
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           FEHLER
           =================================================== -->

      <p
        id="error"
        role="alert">
      </p>


    </form>


    <!-- =====================================================
         NACH DEM ABSENDEN
         ===================================================== -->

    <section
      id="step-done"
      hidden>


      <h2>
        Angemeldet
      </h2>


      <canvas
        id="ticket"
        width="1080"
        height="1350"
        role="img"
        aria-label="Einladungskarte">
      </canvas>


      <p class="actions">


        <button
          type="button"
          id="download">
          Bild herunterladen
        </button>


       
        <a
          class="btn"
          target="_blank"
          rel="noopener"
          href="https://raw.githubusercontent.com/fern5-44/roger.github.io/refs/heads/main/Meine_Termine.ics"
          download>
          Termin in Kalender eintragen
        </a>


      </p>

    </section>


  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="app.js"></script>

</body>

</html>
