<!-- Schritt 0 ------------------------------------------------ -->
<fieldset data-step="0">
  <legend>Ich bin kein Roboter.</legend>



  <p>Beantworte alle drei Fragen richtig, um weiterzukommen.</p>

  <fieldset class="question">
    <legend>Frage 1: Wie alt werde ich?</legend>

    <label>
      <input type="radio" name="question1" value="10011" required />
      10011
    </label>

    <label>
      <input type="radio" name="question1" value="1111" />
      1111
    </label>

    <label>
      <input type="radio" name="question1" value="11111" />
      11111
    </label>

    <label>
      <input type="radio" name="question1" value="10101" />
      10101
    </label>
  </fieldset>

  <fieldset class="question">
    <legend>Frage 2: Welche Zutat kommt nicht auf eine Pizza?</legend>

    <label>
      <input type="radio" name="question2" value="salami" required />
      Salami
    </label>

    <label>
      <input type="radio" name="question2" value="banane" />
      Banane
    </label>

    <label>
      <input type="radio" name="question2" value="ananas" />
      Ananas
    </label>

    <label>
      <input type="radio" name="question2" value="olive" />
      Olive
    </label>
  </fieldset>

  <fieldset class="question">
    <legend>Frage 3: Was sind meine Lieblingsblumen?</legend>

    <label>
      <input type="radio" name="question3" value="rosen-tulpen" required />
      Rosen &amp; Tulpen
    </label>

    <label>
      <input type="radio" name="question3" value="gaensebluemchen" />
      Gänseblümchen &amp; Vergissmeinnicht
    </label>

    <label>
      <input type="radio" name="question3" value="ranunkeln-chrysanthemen" />
      Ranunkeln &amp; Chrysanthemen
    </label>

    <label>
      <input type="radio" name="question3" value="sonnenblumen" />
      Sonnenblumen
    </label>
  </fieldset>

  <p class="nav">
    <button type="button" data-next>Weiter</button>
  </p>
</fieldset>
<!-- Schritt 1 ------------------------------------------------ -->
<fieldset data-step="1" hidden>
  <legend>Bist du dabei?</legend>

  <p>
    <label for="name">Name</label>
    <input
      id="name"
      name="name"
      type="text"
      autocomplete="name"
      required
    />
  </p>

  <p>
    <label for="email">
      E-Mail <span class="opt">(optional)</span>
    </label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
    />
  </p>

  <p class="nav">
    <button type="button" data-back>Zurück</button>
    <button type="button" data-next>Weiter</button>
  </p>
</fieldset>
