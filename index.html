<!-- Schritt 1 ------------------------------------------------ -->
<fieldset data-step="1" hidden>
  <legend>Bist du dabei?</legend>

  <p>
    <label for="name">Name</label>
    <input
      id="name"
      name="name"
      type="text"
      autocomplete="name"
      required
    />
  </p>

  <p>
    <label for="email">
      E-Mail <span class="opt">(optional)</span>
    </label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
    />
  </p>

  <p class="nav">
    <button type="button" data-back>Zurück</button>
    <button type="button" data-next>Weiter</button>
  </p>
</fieldset>
